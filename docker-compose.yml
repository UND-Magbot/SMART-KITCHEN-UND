# SMART Kitchen prototype — Docker Compose
# 빌드: docker compose build
# 실행: docker compose up -d   →  http://<호스트IP>:${HOST_PORT:-8080}
services:
  prototype:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-kitchen-prototype:latest
    container_name: smart-kitchen-prototype
    # HOST_PORT 환경변수로 외부 노출 포트 변경 가능 (기본 8080)
    # 0.0.0.0 바인딩이라 LAN/공인 IP 로 외부에서 접속 가능
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
